name: Render NocturPod startup video in 4K

on:
  push:
    branches: [main]
    paths-ignore:
      - "public/nocturpod-intro.mp4.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nocturpod-startup-asset
  cancel-in-progress: false

jobs:
  render-4k-video:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-inter fonts-dejavu-core

      - name: Install rendering dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pillow

      - name: Render and validate native 4K UHD video
        run: python scripts/render_nocturpod_intro.py

      - name: Commit updated 4K video build source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/nocturpod-intro.mp4.b64
          if git diff --cached --quiet; then
            echo "The generated startup source is unchanged."
            exit 0
          fi
          git commit -m "Build native 4K NocturPod startup video"
          git push
