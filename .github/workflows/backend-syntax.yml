name: Backend Python syntax and super-resolution tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Install focused test dependencies
        run: python -m pip install numpy "opencv-python-headless>=4.9,<4.13"
      - name: Test super-resolution geometry, tiling, retry, and diagnostics
        run: python -m unittest discover -s tests -p "test_super_resolution.py" -v
      - name: Install ONNX Runtime for real model smoke test
        run: python -m pip install "onnxruntime>=1.17,<2"
      - name: Download pinned Real-ESRGAN model and run actual inference
        run: |
          python - <<'PY'
          import json
          from backend.super_resolution import diagnose_super_resolution_model

          result = diagnose_super_resolution_model()
          print(json.dumps(result, indent=2))
          if result.get("status") != "READY":
              raise SystemExit("Pinned Real-ESRGAN model failed load/inference smoke test")
          PY
