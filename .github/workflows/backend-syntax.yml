name: Backend Python syntax check

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
