name: Backend Python syntax and super-resolution tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"
      - ".github/workflows/backend-syntax.yml"

jobs:
  python-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Install focused test dependencies
        run: python -m pip install numpy "opencv-python-headless>=4.9,<4.13"
      - name: Test super-resolution geometry, tiling, and retry
        run: python -m unittest discover -s tests -p "test_super_resolution.py" -v
